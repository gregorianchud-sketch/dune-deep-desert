name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Deep Desert data (falls back to committed JSON)
        run: |
          pip install -r tool/requirements.txt
          python tool/scrape.py || echo "::warning::Scrape failed; using committed assets/data/deep_desert.json"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Deep Desert Companion (latest build)
          body: Automated build from ${{ github.sha }}. Data scraped from Method.gg at build time.
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
